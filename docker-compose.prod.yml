services:
  mysql:
    image: mysql:8
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d

  auth-service:
    build: ./Backend/auth-service
    restart: always

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/users_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}

    depends_on:
      mysql:
        condition: service_healthy

  booking-service:
    build: ./Backend/booking-service
    restart: always

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/bookings_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}

    depends_on:
      mysql:
        condition: service_healthy

  destination-service:
    build: ./Backend/destination-service
    restart: always

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/destinations_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}

    depends_on:
      mysql:
        condition: service_healthy

  packages-service:
    build: ./Backend/packages-service
    restart: always

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/packages_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}

    depends_on:
      mysql:
        condition: service_healthy

  api-gateway:
    build: ./Backend/api-gateway
    restart: always

    ports:
      - "8080:8080"

    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS to the frontend origin}

    depends_on:
      - auth-service
      - booking-service
      - destination-service
      - packages-service

  frontend:
    build:
      context: ./Frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:?Set REACT_APP_API_URL to the public API gateway URL}
    restart: always

    ports:
      - "3000:80"

volumes:
  mysql_data:
