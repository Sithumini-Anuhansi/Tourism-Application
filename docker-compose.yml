services:

  mysql:
    image: mysql:8
    container_name: tourism-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d

  auth-service:
    build: ./Backend/auth-service
    restart: on-failure

    ports:
      - "8081:8081"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/users_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}

    depends_on:
      mysql:
        condition: service_healthy

  booking-service:
    build: ./Backend/booking-service
    restart: on-failure

    ports:
      - "8082:8082"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/bookings_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}

    depends_on:
      mysql:
        condition: service_healthy

  destination-service:
    build: ./Backend/destination-service
    restart: on-failure

    ports:
      - "8083:8083"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/destinations_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}

    depends_on:
      mysql:
        condition: service_healthy

  packages-service:
    build: ./Backend/packages-service
    restart: on-failure

    ports:
      - "8084:8084"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/packages_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}

    depends_on:
      mysql:
        condition: service_healthy

  api-gateway:
    build: ./Backend/api-gateway

    ports:
      - "8080:8080"

    depends_on:
      - auth-service
      - booking-service
      - destination-service
      - packages-service

  frontend:
    build: ./Frontend

    ports:
      - "3000:80"

    depends_on:
      - api-gateway

volumes:
  mysql_data:
